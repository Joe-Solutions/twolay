# Publish app/ as a static HTTPS site so phones can open it once and save it for offline use.
# Only the app and model files are served; the app never sends camera, audio or text anywhere.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/build_manifest.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Rebuilt here so the version and per-file hashes always match what is deployed, even if a
      # commit forgot `npm run manifest`. Phones that saved the app update from these hashes.
      - name: Build asset manifest
        run: python3 scripts/build_manifest.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
